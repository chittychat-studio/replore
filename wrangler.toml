name = "replore"
pages_build_output_dir = "web"

# RS34g: the function refuses every AI check unless TURNSTILE_SECRET is set (Pages -> Settings -> Variables and Secrets).
# For `wrangler pages dev` or a Preview without Turnstile, set ALLOW_NO_TURNSTILE = "1" on that environment only (never
# Production). Optional secrets (16+ chars): EVAL_KEY opens the paid AI check + meaning route for the live eval and
# ops/rag_smoke.py (CI only, never shared); PLUGIN_KEY opens only the meaning route, for the plugin's --semantic.
# Secrets are set in the dashboard, never in this file.
# RS87/RS90 Replore Pro (Stripe Payment Links). Three settings turn it on; without all three the Pro route answers pro_off:
#   STRIPE_SECRET_KEY  (secret) a Stripe RESTRICTED key (rk_live_...) with Read on Checkout Sessions and Subscriptions,
#                      nothing else. Never the full secret key (sk_...).
#   PRO_SIGNING_SECRET (secret) 32+ random characters; signs every key (rp.<subscription id>.<HMAC>). Rotating it
#                      invalidates every key already issued.
#   PRO_PRICE_IDS      (plain variable) the monthly and yearly Pro price ids, comma-separated (price_...,price_...), so
#                      a subscription to another product on the same Stripe account never gets or keeps a key.
#                      PRO_PRODUCT_ID (prod_...) may be set instead, matched on each item's price.product.
# POST /api/pro/claim issues a key for a paid Checkout Session; relevance.js re-checks the subscription (cached 10 minutes
# by SHA-256, never stored or logged). A granted key = PLUGIN_KEY's rights.

# RS34a: Workers AI runs the relevance check first (no key); Groq (LLM_API_KEY) is the fallback. On the Workers Free plan it stops at the daily
# free allocation instead of billing; on Workers Paid, usage past the allocation is billed.
[ai]
binding = "AI"

# RS34d: to keep failure logs (codes and timings only), enable Workers Analytics Engine on the account first, then add:
# [[analytics_engine_datasets]]
# binding = "RELEVANCE_LOG"
# dataset = "replore_relevance_failures"
# (Adding it before Analytics Engine was enabled made the Pages deploy fail.)

# RS42 Phase 2 (hybrid RAG): after creating the index (npx wrangler vectorize create replore-repos --dimensions=1024 --metric=cosine)
# and filling it (Actions -> rag-ingest), add the binding below and set RAG_INDEX=1 in Pages -> Settings -> Variables.
# Adding the binding before the index exists can make the Pages deploy fail.
# [[vectorize]]
# binding = "REPOS_INDEX"
# index_name = "replore-repos"
# Phase 1 needs no binding: set RAG_RERANK=1 (uses the AI binding above).

# RS95/RS96 quota-aware router + daily AI credits: deploy router/ first (cd router && npx wrangler deploy), then uncomment.
# Without this binding the relevance check runs the RS34a chain unchanged. The router Worker needs no secrets; the keys
# below stay in this Pages project: MISTRAL_API_KEY (only after switching off training in Mistral's Admin Console),
# PAID_LLM_API_KEY + ROUTER_DAILY_BUDGET_USD (default 0 = paid overflow off), PRO_LLM_DAILY_BUDGET_USD (default 0 = off),
# ROUTER_CREDITS_ANON (5), ROUTER_CREDITS_SIGNED_IN (20). Owner status: GET /api/relevance?router=status with EVAL_KEY.
# [[durable_objects.bindings]]
# name = "ROUTER"
# class_name = "RouterDO"
# script_name = "replore-router"
