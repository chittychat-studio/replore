name = "replore"
pages_build_output_dir = "web"

# RS34g: the function refuses every AI check unless TURNSTILE_SECRET is set (Pages -> Settings -> Variables and Secrets).
# For `wrangler pages dev` or a Preview without Turnstile, set ALLOW_NO_TURNSTILE = "1" on that environment only (never
# Production). Optional secrets (16+ chars): EVAL_KEY opens the paid AI check + meaning route for the live eval and
# ops/rag_smoke.py (CI only, never shared); PLUGIN_KEY opens only the meaning route, for the plugin's --semantic.
# Secrets are set in the dashboard, never in this file.
# RS87 Replore Pro: set POLAR_ORG_ID (your Polar organization id, public, a plain variable, not a secret) to turn on
# Pro keys; optionally POLAR_BENEFIT_ID (the license-key benefit's id) so only that benefit's keys count. Without
# POLAR_ORG_ID the Pro route is off (403 pro_off). No Polar token is needed: keys are checked with Polar's public
# validate endpoint, cached 10 minutes by SHA-256, never stored or logged. A granted key = PLUGIN_KEY's rights.

# RS34a: Workers AI runs the relevance check first (no key); Groq (LLM_API_KEY) is the fallback. On the Workers Free plan it stops at the daily
# free allocation instead of billing; on Workers Paid, usage past the allocation is billed.
[ai]
binding = "AI"

# RS34d: to keep failure logs (codes and timings only), enable Workers Analytics Engine on the account first, then add:
# [[analytics_engine_datasets]]
# binding = "RELEVANCE_LOG"
# dataset = "replore_relevance_failures"
# (Adding it before Analytics Engine was enabled made the Pages deploy fail.)

# RS42 Phase 2 (hybrid RAG): after creating the index (npx wrangler vectorize create replore-repos --dimensions=1024 --metric=cosine)
# and filling it (Actions -> rag-ingest), add the binding below and set RAG_INDEX=1 in Pages -> Settings -> Variables.
# Adding the binding before the index exists can make the Pages deploy fail.
# [[vectorize]]
# binding = "REPOS_INDEX"
# index_name = "replore-repos"
# Phase 1 needs no binding: set RAG_RERANK=1 (uses the AI binding above).
