# SPEC RS34/RS34e: score the deployed AI check against the 84-item set. Manual only — each run spends ~9 AI checks from
# the site's free daily allowance, so it never runs on pushes or PRs.
name: relevance-eval-live
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Endpoint to score (production or a preview URL)"
        default: "https://replore.cardzo.co.in/api/relevance"
permissions:
  contents: read
concurrency:
  group: relevance-eval
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Score the endpoint
        env:
          ENDPOINT: ${{ inputs.endpoint }}   # passed as data, never pasted into the script
          REPLORE_EVAL_KEY: ${{ secrets.REPLORE_EVAL_KEY }}   # RS34g: the deployment's EVAL_KEY (repo secret); empty = no key sent
        run: |
          # RS34g: the eval key goes only to Replore's own hosts. A shell `case` glob lets `*` match "/" and any host,
          # so the check is an anchored regex: replore.cardzo.co.in, replore.pages.dev or one preview label under it.
          if ! [[ "$ENDPOINT" =~ ^https://(replore\.cardzo\.co\.in|([a-z0-9-]{1,63}\.)?replore\.pages\.dev)/api/relevance$ ]]; then
            echo "endpoint must be https://replore.cardzo.co.in/api/relevance or https://<preview>.replore.pages.dev/api/relevance"; exit 2
          fi
          node evals/relevance_live.mjs "$ENDPOINT"
