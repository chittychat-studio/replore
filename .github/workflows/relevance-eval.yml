# SPEC RS34/RS34e: score the deployed AI check against the 84-item set. Manual only — each run spends ~9 AI checks from
# the site's free daily allowance, so it never runs on pushes or PRs.
name: relevance-eval-live
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Endpoint to score (production or a preview URL)"
        default: "https://replore.cardzo.co.in/api/relevance"
permissions:
  contents: read
concurrency:
  group: relevance-eval
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Score the endpoint
        env:
          ENDPOINT: ${{ inputs.endpoint }}   # passed as data, never pasted into the script
          REPLORE_PLUGIN_KEY: ${{ secrets.REPLORE_PLUGIN_KEY }}   # RS34g: the deployment's PLUGIN_KEY (repo secret); empty = no key sent
        run: |
          case "$ENDPOINT" in https://*.pages.dev/api/relevance|https://replore.cardzo.co.in/api/relevance) ;; *) echo "endpoint must be a *.pages.dev or replore.cardzo.co.in /api/relevance URL"; exit 2;; esac
          node evals/relevance_live.mjs "$ENDPOINT"
