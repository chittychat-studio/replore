# Unit tests only. No network calls, no secrets (RS11).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # RS48: Windows users run the plugin too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - run: node tests/test_web_logic.js
      - run: node tests/test_auth_web.js  # RS94 sign-in box logic (no browser, no network)
      - run: node tests/test_relevance_fn.mjs  # RS34 relevance function (fake LLM, no network)
      - run: node tests/test_trust_fn.mjs  # RS53b trust function (fake Scorecard/deps.dev, no network)
      - run: node tests/test_pro_fn.mjs  # RS90 Pro key claim function (fake Stripe, no network)
      - run: node tests/test_playbook_fn.mjs  # RS97 Pro playbook function (fake KV, no network)
      - run: node tests/test_templates_fn.mjs  # RS98 Templates showroom pass-through (fake storefront, no network)
      - run: node tests/test_playbooks_web.js  # RS97 step cards: safe renderer and progress
      - run: node tests/test_auth_fn.mjs  # RS94 sign-in functions (fake Google keys, Identity Toolkit and Stripe, no network)
      - run: node tests/test_router.mjs  # RS95/RS96 router scheduler, budgets, credits (fake clock, no network)
      - run: node tests/test_router_fn.mjs  # RS95/RS96 relevance check with the router bound (fake DO and providers)
      - run: node tests/sim_router.mjs  # RS95 one simulated day at 25,000 checks: limits, budget cap, DO free plan
      - run: python evals/run.py  # RS5: goal-based fit-ranking evals must pass
  # RS50: the one check the `protect main` ruleset requires. It always runs (a skipped required check would count
  # as passing) and passes only when every test job, on every OS, succeeded.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success"
